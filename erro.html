
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manutenção | Revisão</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <style>
        /* --- 1. DEFINIÇÃO DAS CORES E VARIÁVEIS --- */
        :root {
            /* TEMA CLARO (Padrão) */
            --font-main: 'Plus Jakarta Sans', sans-serif;
            
            --bg-body: #F2F2F2;       /* Cinza muito suave para o fundo */
            --bg-card: #FFFFFF;       /* Branco puro para o card */
            
            --text-primary: #111111;
            --text-secondary: #666666;
            
            --border-card: #E5E5E5;
            --border-highlight: #F4F4F5;
            
            --accent-color: #F59E0B;  /* Âmbar/Laranja */
            --accent-bg-badge: rgba(245, 158, 11, 0.1);
            
            --progress-bg: #E5E5E5;   /* Fundo da barra de progresso */
            --shadow-card: 0 10px 40px -10px rgba(0,0,0,0.08);

            --btn-bg: #111111;
            --btn-text: #FFFFFF;
            
            --radius-xl: 24px;
            --radius-md: 12px;
        }

        /* TEMA ESCURO (Ativado via JS) */
        body.dark-mode {
            --bg-body: #09090b;       /* Preto quase absoluto */
            --bg-card: #0a0a0a;       /* Cinza chumbo */
            
            --text-primary: #FFFFFF;
            --text-secondary: #A1A1AA;
            
            --border-card: #27272a;
            --border-highlight: #3f3f46;
            
            --progress-bg: #27272a;   /* Fundo da barra mais escuro */
            --shadow-card: 0 0 0 0 transparent; /* Sombra removida no dark mode */

            --btn-bg: #FFFFFF;
            --btn-text: #000000;
        }

        /* --- 2. RESET E ESTRUTURA --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-font-smoothing: antialiased;
        }

        body {
            font-family: var(--font-main);
            background-color: var(--bg-body);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        .container {
            width: 100%;
            max-width: 480px;
            display: flex;
            flex-direction: column;
            gap: 24px; /* Espaço entre o Logo e o Card */
        }

        /* --- 3. LOGO (Agora fora do card) --- */
        .top-header {
            text-align: center;
            animation: fadeDown 0.6s ease-out forwards;
        }

        .logo {
            font-size: 26px;
            font-weight: 800;
            letter-spacing: -0.03em;
            color: var(--text-primary);
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .logo .dot { 
            color: var(--accent-color); 
            font-size: 32px;
            line-height: 0;
            margin-left: 2px;
            margin-bottom: 8px; /* Ajuste fino para alinhar o ponto */
        }

        /* --- 4. CARD PRINCIPAL --- */
        .error-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-card);
            border-top: 1px solid var(--border-highlight); /* Luz vinda de cima */
            border-radius: var(--radius-xl);
            padding: 48px 40px;
            text-align: center;
            box-shadow: var(--shadow-card);
            animation: fadeUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            transition: background-color 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
        }

        /* Badge */
        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            color: var(--accent-color);
            background: var(--accent-bg-badge);
            border: 1px solid rgba(245, 158, 11, 0.2);
            padding: 6px 12px;
            border-radius: 99px;
            margin-bottom: 32px;
        }

        .status-badge .pulsing-dot {
            width: 6px;
            height: 6px;
            background-color: var(--accent-color);
            border-radius: 50%;
            box-shadow: 0 0 10px var(--accent-color);
            animation: pulse 2s infinite;
        }

        /* Ícone e Textos */
        .icon-area {
            font-size: 56px;
            margin-bottom: 24px;
            color: var(--text-primary);
            display: flex;
            justify-content: center;
        }

        h1 {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 12px;
            letter-spacing: -0.02em;
            line-height: 1.3;
        }

        p {
            font-size: 15px;
            color: var(--text-secondary);
            line-height: 1.6;
            margin-bottom: 32px;
        }

        /* --- 5. BARRA DE PROGRESSO --- */
        .progress-container {
            width: 100%;
            height: 6px;
            background: var(--progress-bg); /* Cor corrigida por variável */
            border-radius: 100px;
            margin-bottom: 40px;
            position: relative;
            overflow: hidden;
        }

        .progress-bar {
            position: absolute;
            height: 100%;
            width: 30%;
            background: var(--text-primary);
            border-radius: 100px;
            animation: progressMove 1.5s infinite ease-in-out;
        }

        /* --- 6. BOTÃO --- */
        .btn-primary {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 14px 24px;
            border-radius: var(--radius-md);
            background-color: var(--btn-bg);
            color: var(--btn-text);
            font-weight: 600;
            font-size: 14px;
            text-decoration: none;
            transition: transform 0.2s ease, opacity 0.2s ease;
            width: 100%; /* Botão full width no mobile */
        }
        
        .btn-primary:hover {
            opacity: 0.9;
            transform: translateY(-2px);
        }

        /* --- ANIMAÇÕES --- */
        @keyframes progressMove {
            0% { left: -30%; }
            100% { left: 100%; }
        }

        @keyframes pulse {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.5); opacity: 0.5; }
            100% { transform: scale(1); opacity: 1; }
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeDown {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <main class="container">
        


        <div class="error-card">
              
        
            <div class="status-badge">
                <span class="pulsing-dot"></span> Em andamento 
            </div>

            <div class="icon-area">
                <i class="ph-duotone ph-wrench"></i>
                
            </div>

            <h1>Página Em Manutenção</h1>
            
            <p>
                Estamos aplicando melhorias na plataforma para turbinar seus estudos. A previsão de retorno é em breve.
            </p>

            <div class="progress-container">
                <div class="progress-bar"></div>
            </div>

            <a href="index.html" class="btn btn-primary">
                                    <i class="ph-bold ph-house"></i>
                Voltar para o Início
            </a>
        </div>
    </main>

    <script>
        // Lógica de Detecção de Tema (Automática)
        (function() {
            try {
                // 1. Tenta pegar do LocalStorage
                const savedTheme = localStorage.getItem('theme');
                
                // 2. Tenta pegar do Sistema Operacional
                const systemPrefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;

                // Aplica Dark Mode se:
                // (Estiver salvo 'dark') OU (Não tiver nada salvo E o sistema for dark)
                if (savedTheme === 'dark' || (!savedTheme && systemPrefersDark)) {
                    document.body.classList.add('dark-mode');
                } else {
                    document.body.classList.remove('dark-mode');
                }
                
                // Opcional: Escuta mudanças no sistema operacional em tempo real
                window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', e => {
                    if (!localStorage.getItem('theme')) { // Só muda se o usuário não forçou uma preferência
                        if (e.matches) document.body.classList.add('dark-mode');
                        else document.body.classList.remove('dark-mode');
                    }
                });

            } catch (e) {
                console.log('Erro ao aplicar tema:', e);
            }
        })();
    </script>
</body>
</html>
