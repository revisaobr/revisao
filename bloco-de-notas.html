    <style>
        /* --- VARIÁVEIS ORIGINAIS + NOVAS --- */
        :root {
            --font-main: 'Plus Jakarta Sans', sans-serif;
            --prose-width: 1200px;

            /* Cores Base */
            --bg-color: #f4f4f5;
            --cordabarra: rgba(255, 255, 255, 0.85);
            --text-primary: #18181b;
            --text-secondary: #71717a;
            --border-color: #e4e4e7;
            --accent-color: #000000;
            --danger-color: #ef4444;
            
            /* Cores das Notas */
            --note-white: #ffffff;
            --note-yellow: #fef3c7;
            --note-green: #dcfce7;
            --note-blue: #dbeafe;
            --note-purple: #f3e8ff;
            --note-red: #fee2e2;

            /* UI Elements */
            --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
            --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
            --radius-md: 12px;
            --radius-lg: 16px;
        }

        body.dark-mode {
            --bg-color: #000000;
            --cordabarra: rgba(9, 9, 11, 0.85);
            --text-primary: #fafafa;
            --text-secondary: #a1a1aa;
            --border-color: #27272a;
            --accent-color: #60a5fa;

            --note-white: #18181b;
            --note-yellow: #422006;
            --note-green: #14532d;
            --note-blue: #1e3a8a;
            --note-purple: #581c87;
            --note-red: #7f1d1d;
        }

        body { margin: 0; background: var(--bg-color); font-family: var(--font-main); color: var(--text-primary); transition: background 0.3s; }

        /* --- CABEÇALHO ORIGINAL RESTAURADO --- */
        

        /* --- LAYOUT PRINCIPAL --- */
        .app-anotacoes {
            max-width: var(--prose-width); margin: 0 auto; padding: 0 2rem 3rem 2rem;
            animation: fadeIn 0.8s ease;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* Painel de Controle */
        .painel-controle {
            display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center;
            margin-bottom: 2rem; gap: 1.5rem; background: var(--note-white);
            padding: 1.5rem; border-radius: var(--radius-lg); border: 1px solid var(--border-color);
            box-shadow: var(--shadow-sm);
        }
        .info-data h2 { font-size: 1.5rem; margin: 0; font-weight: 800; }
        .info-data span { color: var(--text-secondary); font-size: 0.9rem; }

        .campo-pesquisa { position: relative; flex: 1; max-width: 450px; }
        .campo-pesquisa i { position: absolute; left: 1rem; top: 50%; transform: translateY(-50%); color: var(--text-secondary); }
        .input-moderno {
            width: 100%; padding: 1rem 1rem 1rem 3rem; background: var(--bg-color);
            border: 2px solid transparent; border-radius: var(--radius-md);
            color: var(--text-primary); font-family: var(--font-main);
        }
        .input-moderno:focus { outline: none; background: var(--note-white); border-color: var(--accent-color); }

        .grupo-botoes { display: flex; gap: 0.8rem; }
        .btn-acao {
            padding: 0.8rem 1.5rem; border-radius: var(--radius-md); border: none; font-weight: 600;
            cursor: pointer; display: flex; align-items: center; gap: 0.5rem; font-family: var(--font-main);
        }
        .btn-primario { background: var(--text-primary); color: var(--bg-color); }
        .btn-perigo { background: rgba(239, 68, 68, 0.1); color: var(--danger-color); }

        /* --- GRID E CARTÕES (EDITOR NOVO) --- */
        .grade-notas {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(350px, 1fr)); gap: 1.5rem;
        }

        .cartao-nota {
            background: var(--note-white); border-radius: var(--radius-lg); padding: 1.5rem;
            box-shadow: var(--shadow-sm); border: 1px solid rgba(0,0,0,0.05);
            display: flex; flex-direction: column; min-height: 480px;
            position: relative; transition: all 0.3s ease;
        }
        .cartao-nota:hover { transform: translateY(-5px); box-shadow: 0 15px 30px -10px rgba(0,0,0,0.1); z-index: 5; }

        .nota-titulo {
            width: 100%; border: none; background: transparent; font-size: 1.25rem; font-weight: 800;
            color: var(--text-primary); margin-bottom: 0.8rem; padding: 0.2rem 0; border-bottom: 1px solid transparent;
        }
        .nota-titulo:focus { outline: none; border-bottom: 1px solid var(--border-color); }

        /* EDITOR RICH TEXT */
        .nota-conteudo-rich {
            flex-grow: 1; width: 100%; background: transparent; color: var(--text-secondary);
            font-size: 1rem; line-height: 1.6; outline: none; overflow-y: auto; white-space: pre-wrap;
            margin-bottom: 10px;
        }
        /* Estilos internos do editor */
        .nota-conteudo-rich ul, .nota-conteudo-rich ol { padding-left: 20px; margin: 0.5rem 0; }
        .nota-conteudo-rich b, .nota-conteudo-rich strong { font-weight: 800; color: var(--text-primary); }
        .nota-conteudo-rich h1 { font-size: 1.4em; margin: 5px 0; color: var(--text-primary); line-height: 1.2; }
        .nota-conteudo-rich h2 { font-size: 1.2em; margin: 5px 0; color: var(--text-primary); }

        /* BARRA DE FERRAMENTAS (EMBAIXO) */
        .barra-formatacao {
            display: flex; gap: 4px; padding: 8px; background: rgba(0,0,0,0.04);
            border-radius: 10px; flex-wrap: wrap; margin-top: auto; margin-bottom: 10px;
            border: 1px solid rgba(0,0,0,0.05);
        }
        .btn-format {
            background: transparent; border: none; color: var(--text-secondary);
            width: 30px; height: 30px; border-radius: 6px; cursor: pointer;
            display: flex; align-items: center; justify-content: center; font-size: 1.1rem;
        }
        .btn-format:hover { background: rgba(0,0,0,0.08); color: var(--text-primary); }
        /* Estado Ativo */
        .btn-format.ativo { background-color: var(--text-primary); color: var(--bg-color); }

        .divisoria-tools { width: 1px; background: rgba(0,0,0,0.15); margin: 0 4px; height: 16px; align-self: center; }

        /* Rodapé da Nota */
        .nota-rodape {
            margin-top: 5px; padding-top: 10px; border-top: 1px solid rgba(0,0,0,0.05);
            display: flex; justify-content: space-between; align-items: center;
            font-size: 0.75rem; color: var(--text-secondary);
        }
        .ferramentas-nota { display: flex; gap: 4px; opacity: 0.8; }
        .cartao-nota:hover .ferramentas-nota { opacity: 1; }
        .btn-icone { background: transparent; border: none; padding: 6px; border-radius: 6px; cursor: pointer; color: var(--text-secondary); font-size: 1.1rem; }
        .btn-icone:hover { background: rgba(0,0,0,0.05); color: var(--text-primary); }
        .btn-icone.deletar:hover { background: rgba(239, 68, 68, 0.1); color: var(--danger-color); }

        /* Paleta e Modais (Originais) */
        .seletor-cores {
            position: absolute; bottom: 3.5rem; right: 1rem; background: var(--bg-color);
            padding: 0.8rem; border-radius: 50px; display: flex; gap: 0.5rem;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15); border: 1px solid var(--border-color);
            opacity: 0; transform: translateY(10px); pointer-events: none; transition: 0.3s; z-index: 10;
        }
        .seletor-cores.ativo { opacity: 1; transform: translateY(0); pointer-events: all; }
        .ponto-cor { width: 24px; height: 24px; border-radius: 50%; cursor: pointer; border: 2px solid rgba(0,0,0,0.1); transition: transform 0.2s; }
        .ponto-cor:hover { transform: scale(1.2); }

        .overlay-interface {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.4); backdrop-filter: blur(4px); z-index: 9999;
            display: flex; justify-content: center; align-items: center;
            opacity: 0; visibility: hidden; transition: 0.3s;
        }
        .overlay-interface.visivel { opacity: 1; visibility: visible; }
        .janela-confirmacao {
            background: var(--bg-color); padding: 2rem; border-radius: var(--radius-lg);
            width: 90%; max-width: 400px; text-align: center; border: 1px solid var(--border-color);
            box-shadow: 0 20px 50px rgba(0,0,0,0.2); transform: scale(0.9); transition: 0.3s;
        }
        .overlay-interface.visivel .janela-confirmacao { transform: scale(1); }
        .janela-icone { font-size: 3rem; color: var(--danger-color); margin-bottom: 1rem; }
        .janela-titulo { font-size: 1.25rem; font-weight: 700; margin-bottom: 0.5rem; }
        .janela-botoes { display: flex; gap: 1rem; justify-content: center; margin-top: 1.5rem; }

        .aviso-sistema-container { position: fixed; bottom: 2rem; right: 2rem; z-index: 10000; display: flex; flex-direction: column; gap: 10px; pointer-events: none; }
        .cartao-aviso {
            background: var(--text-primary); color: var(--bg-color); padding: 1rem 1.5rem;
            border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.2); display: flex; align-items: center;
            gap: 12px; font-weight: 600; animation: slideIn 0.4s forwards;
        }
        @keyframes slideIn { from { transform: translateX(100px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

    </style>
</head>

    <script>
    /* ========================================================
       LÓGICA JAVASCRIPT: EDITOR POWERED (ATUALIZADO)
       ======================================================== */

    const sistemaNotas = {
        // Usa o localStorage original ou um novo se preferir migrar
        dados: JSON.parse(localStorage.getItem('notas_app_moderno_v3')) || [],
        
        iniciar() {
            this.atualizarDatas();
            this.renderizar();
            
            // Busca em tempo real
            document.getElementById('input-busca').addEventListener('input', (e) => {
                this.renderizar(e.target.value);
            });

            // Fecha modais e paletas ao clicar fora
            document.addEventListener('click', (e) => {
                if (!e.target.closest('.seletor-cores') && !e.target.closest('.btn-icone')) {
                    document.querySelectorAll('.seletor-cores').forEach(el => el.classList.remove('ativo'));
                }
                if (e.target.classList.contains('overlay-interface')) {
                    this.fecharModal();
                }
                
            });
        },

        atualizarDatas() {
            const hoje = new Date();
            const dias = ['Domingo', 'Segunda-feira', 'Terça-feira', 'Quarta-feira', 'Quinta-feira', 'Sexta-feira', 'Sábado'];
            const meses = ['Janeiro', 'Fevereiro', 'Março', 'Abril', 'Maio', 'Junho', 'Julho', 'Agosto', 'Setembro', 'Outubro', 'Novembro', 'Dezembro'];
            
            document.getElementById('dia-semana').textContent = dias[hoje.getDay()];
            document.getElementById('data-completa').textContent = `${hoje.getDate()} de ${meses[hoje.getMonth()]} de ${hoje.getFullYear()}`;
        },

        criarNota() {
            const novaNota = {
                id: Date.now().toString(),
                titulo: '',
                texto: '<div><br></div>',
                cor: 'var(--note-white)',
                dataMod: new Date(),
                chars: 0
            };
            this.dados.unshift(novaNota);
            this.salvar();
            this.notificar('Nova anotação criada', 'ph-check');
        },

        atualizarNota(id, campo, valor) {
            const nota = this.dados.find(n => n.id === id);
            if (nota) {
                nota[campo] = valor;
                nota.dataMod = new Date();
                
                if(campo === 'texto') {
                    // Atualiza contagem
                    const div = document.createElement('div');
                    div.innerHTML = valor;
                    nota.chars = div.textContent.length;
                    
                    // Verifica botões ativos
                    this.verificarBotoesAtivos(id);
                }
                
                this.salvarLocal(); 
                
                // Atualiza UI parcial
                const card = document.getElementById(`card-${id}`);
                if(card) {
                    card.querySelector('.data-mod').textContent = this.formatarData(nota.dataMod);
                    card.querySelector('.contador-chars').textContent = `${nota.chars} carac.`;
                }
            }
        },

        // --- SISTEMA DE FORMATAÇÃO E STATUS ---
        executarComando(cmd, valor = null) {
            document.execCommand(cmd, false, valor);
            
            // Força atualização do estado dos botões imediatamente
            const selection = window.getSelection();
            if (selection.rangeCount > 0) {
                const element = selection.focusNode.parentElement.closest('.nota-conteudo-rich');
                if (element) {
                    const id = element.id.replace('editor-', '');
                    this.atualizarNota(id, 'texto', element.innerHTML); // Salva
                }
            }
        },

        verificarBotoesAtivos(id) {
            const card = document.getElementById(`card-${id}`);
            if(!card) return;

// Mapeia comando -> classe do botão
            const mapa = [
                { cmd: 'bold', class: '.btn-bold' },
                { cmd: 'italic', class: '.btn-italic' },
                { cmd: 'underline', class: '.btn-underline' },
                { cmd: 'strikeThrough', class: '.btn-strike' },
                { cmd: 'insertUnorderedList', class: '.btn-ul' },
                { cmd: 'insertOrderedList', class: '.btn-ol' },
                { cmd: 'justifyLeft', class: '.btn-left' },
                { cmd: 'justifyCenter', class: '.btn-center' },
                { cmd: 'justifyRight', class: '.btn-right' }
            ];

            mapa.forEach(item => {
                const btn = card.querySelector(item.class);
                if(btn) {
                    if(document.queryCommandState(item.cmd)) {
                        btn.classList.add('ativo');
                    } else {
                        btn.classList.remove('ativo');
                    }
                }
            });
        },

        formatarData(dataStr) {
            const data = new Date(dataStr);
            return data.toLocaleString('pt-BR', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' });
        },

        abrirPaleta(id) {
            const paleta = document.getElementById(`paleta-${id}`);
            document.querySelectorAll('.seletor-cores').forEach(p => {
                if(p.id !== `paleta-${id}`) p.classList.remove('ativo');
            });
            paleta.classList.toggle('ativo');
        },

        mudarCor(id, corVar) {
            const nota = this.dados.find(n => n.id === id);
            if(nota) {
                nota.cor = corVar;
                this.salvar();
            }
        },

        baixarTxt(id) {
            const nota = this.dados.find(n => n.id === id);
            if(!nota) return;
            const div = document.createElement('div');
            div.innerHTML = nota.texto;
            const conteudo = `=== ${nota.titulo || 'Sem Título'} ===\nData: ${this.formatarData(nota.dataMod)}\n\n${div.innerText}`;
            const blob = new Blob([conteudo], { type: 'text/plain' });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `${nota.titulo || 'anotacao'}.txt`;
            a.click();
        },

        solicitarExclusao(id) {
            this.abrirModal('Excluir anotação?', 'Você perderá este conteúdo permanentemente.', () => {
                this.dados = this.dados.filter(n => n.id !== id);
                this.salvar();
                this.notificar('Nota excluída', 'ph-trash');
            });
        },

        confirmarLimpeza() {
            if(this.dados.length === 0) return this.notificar('Nada para apagar', 'ph-info');
            this.abrirModal('Apagar TUDO?', 'Todas as suas anotações serão destruídas.', () => {
                this.dados = [];
                this.salvar();
                this.notificar('Tudo foi limpo', 'ph-trash');
            });
        },

        abrirModal(titulo, texto, callbackConfirmacao) {
            const modal = document.getElementById('interface-confirmacao');
            document.getElementById('titulo-modal').textContent = titulo;
            document.getElementById('texto-modal').textContent = texto;
            
            const btnConfirmar = document.getElementById('btn-confirmar-modal');
            const novoBtn = btnConfirmar.cloneNode(true);
            btnConfirmar.parentNode.replaceChild(novoBtn, btnConfirmar);
            
            novoBtn.addEventListener('click', () => {
                callbackConfirmacao();
                this.fecharModal();
            });

            document.getElementById('btn-cancelar-modal').onclick = () => this.fecharModal();
            modal.classList.add('visivel');
        },

        fecharModal() {
            document.getElementById('interface-confirmacao').classList.remove('visivel');
        },
        
        salvarLocal() {
            localStorage.setItem('notas_app_moderno_v3', JSON.stringify(this.dados));
        },

        salvar() {
            this.salvarLocal();
            this.renderizar(document.getElementById('input-busca').value);
        },

        renderizar(termo = '') {
            const container = document.getElementById('container-notas');
            container.innerHTML = '';
            
            const filtradas = this.dados.filter(n => (n.titulo + n.texto).toLowerCase().includes(termo.toLowerCase()));

            if (filtradas.length === 0) {
                container.innerHTML = `
                    <div style="grid-column: 1/-1; text-align: center; padding: 4rem; color: var(--text-secondary);">
                        <i class="ph ph-notepad" style="font-size: 3rem; margin-bottom: 1rem; opacity: 0.5;"></i>
                        <p>Nenhuma anotação encontrada.</p>
                    </div>
                `;
                return;
            }

            filtradas.forEach(nota => {
                const el = document.createElement('div');
                el.className = 'cartao-nota';
                el.id = `card-${nota.id}`;
                el.style.backgroundColor = nota.cor; 

                const cores = ['var(--note-white)', 'var(--note-yellow)', 'var(--note-green)', 'var(--note-blue)', 'var(--note-purple)', 'var(--note-red)'];
                
                el.innerHTML = `
                    <input class="nota-titulo" placeholder="Título..." value="${nota.titulo}" 
                        oninput="sistemaNotas.atualizarNota('${nota.id}', 'titulo', this.value)">
                    
                    <div class="nota-conteudo-rich" id="editor-${nota.id}" contenteditable="true" 
                         onmouseup="sistemaNotas.verificarBotoesAtivos('${nota.id}')"
                         onkeyup="sistemaNotas.verificarBotoesAtivos('${nota.id}')"
                         oninput="sistemaNotas.atualizarNota('${nota.id}', 'texto', this.innerHTML)">${nota.texto}</div>
                    
                    <div class="barra-formatacao" onmousedown="event.preventDefault()">
                        <button class="btn-format btn-undo" title="Desfazer" onclick="sistemaNotas.executarComando('undo')"><i class="ph ph-arrow-u-up-left"></i></button>
                        <button class="btn-format btn-redo" title="Refazer" onclick="sistemaNotas.executarComando('redo')"><i class="ph ph-arrow-u-up-right"></i></button>
                        <div class="divisoria-tools"></div>
                        <button class="btn-format" title="H1" onclick="sistemaNotas.executarComando('formatBlock', 'H1')"><b>H1</b></button>
                        <button class="btn-format" title="H2" onclick="sistemaNotas.executarComando('formatBlock', 'H2')"><b>H2</b></button>
                        <div class="divisoria-tools"></div>
                        <button class="btn-format btn-bold" title="Negrito" onclick="sistemaNotas.executarComando('bold')"><i class="ph ph-text-b"></i></button>
                        <button class="btn-format btn-italic" title="Itálico" onclick="sistemaNotas.executarComando('italic')"><i class="ph ph-text-italic"></i></button>
                        <button class="btn-format btn-underline" title="Sublinhado" onclick="sistemaNotas.executarComando('underline')"><i class="ph ph-text-underline"></i></button>
                        <button class="btn-format btn-strike" title="Riscado" onclick="sistemaNotas.executarComando('strikeThrough')"><i class="ph ph-text-strikethrough"></i></button>
                        <div class="divisoria-tools"></div>
                        <button class="btn-format btn-left" title="Esquerda" onclick="sistemaNotas.executarComando('justifyLeft')"><i class="ph ph-text-align-left"></i></button>
                        <button class="btn-format btn-center" title="Centro" onclick="sistemaNotas.executarComando('justifyCenter')"><i class="ph ph-text-align-center"></i></button>
                        <button class="btn-format btn-right" title="Direita" onclick="sistemaNotas.executarComando('justifyRight')"><i class="ph ph-text-align-right"></i></button>
                        <div class="divisoria-tools"></div>
                        <button class="btn-format btn-ul" title="Lista" onclick="sistemaNotas.executarComando('insertUnorderedList')"><i class="ph ph-list-bullets"></i></button>
                        <button class="btn-format btn-ol" title="Numérica" onclick="sistemaNotas.executarComando('insertOrderedList')"><i class="ph ph-list-numbers"></i></button>
                        <div class="divisoria-tools"></div>
                        <button class="btn-format" title="Limpar" onclick="sistemaNotas.executarComando('removeFormat')"><i class="ph ph-eraser"></i></button>
                    </div>

                    <div class="seletor-cores" id="paleta-${nota.id}">
                        ${cores.map(c => `<div class="ponto-cor" style="background: ${c}" onclick="sistemaNotas.mudarCor('${nota.id}', '${c}')"></div>`).join('')}
                    </div>

                    <div class="nota-rodape">
                        <div>
                            <span class="data-mod" style="display:block; font-weight:600">${this.formatarData(nota.dataMod)}</span>
                            <span class="contador-chars">${nota.chars || 0} carac.</span>
                        </div>
                        <div class="ferramentas-nota">
                            <button class="btn-icone" onclick="sistemaNotas.abrirPaleta('${nota.id}')" title="Cor"><i class="ph ph-palette"></i></button>
                            <button class="btn-icone" onclick="sistemaNotas.baixarTxt('${nota.id}')" title="Salvar TXT"><i class="ph ph-download-simple"></i></button>
                            <button class="btn-icone deletar" onclick="sistemaNotas.solicitarExclusao('${nota.id}')" title="Excluir"><i class="ph ph-trash"></i></button>
                        </div>
                    </div>
                `;
                container.appendChild(el);
            });
        },

        notificar(msg, icone = 'ph-check') {
            const container = document.getElementById('container-avisos');
            const aviso = document.createElement('div');
            aviso.className = 'cartao-aviso';
            aviso.innerHTML = `<i class="ph ${icone}" style="font-size: 1.3rem;"></i> ${msg}`;
            container.appendChild(aviso);
            setTimeout(() => {
                aviso.style.opacity = '0';
                aviso.style.transform = 'translateY(10px)';
                setTimeout(() => aviso.remove(), 400);
            }, 3000);
        }
    };

    // Inicializa
    sistemaNotas.iniciar();
      
    </script>

</body>
</html>
