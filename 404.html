<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página não encontrada | Revisão</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <style>
        /* --- 1. SISTEMA DE CORES E TEMAS --- */
        :root {
            /* TEMA CLARO (Padrão) */
            --font-main: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            
            --bg-body: #F2F2F2;
            --card-bg: #FFFFFF;
            
            --card-border: #E5E5E5;
            --card-border-highlight: #FFFFFF; /* Brilho superior sutil no claro */

            --text-primary: #111111;
            --text-secondary: #666666;
            
            --accent-color: #3b82f6; /* Azul mantido */
            --badge-bg: #F4F4F5;     /* Fundo do badge no claro */
            --badge-border: #E4E4E7;

            --btn-primary-bg: #111111;
            --btn-primary-text: #FFFFFF;
            
            --btn-sec-bg: transparent;
            --btn-sec-text: #666666;
            --btn-sec-border: #E5E5E5;
            --btn-sec-hover-bg: #FAFAFA;
            --btn-sec-hover-border: #D4D4D4;

            /* Gradiente do ícone escuro para o tema claro */
            --icon-gradient: linear-gradient(135deg, #1e293b 0%, #64748b 100%);
            
            --shadow-card: 0 20px 40px -20px rgba(0,0,0,0.1);
            
            --radius-xl: 24px;
            --radius-md: 12px;
        }

        /* TEMA ESCURO (Suas cores originais) */
        body.dark-mode {
            --bg-body: #000000;
            --card-bg: #0a0a0a;
            
            --card-border: #1f1f1f;
            --card-border-highlight: rgba(255, 255, 255, 0.1);

            --text-primary: #ffffff;
            --text-secondary: #a1a1aa;
            
            --badge-bg: #111111;
            --badge-border: #1f1f1f;

            --btn-primary-bg: #ffffff;
            --btn-primary-text: #000000;
            
            --btn-sec-text: #a1a1aa;
            --btn-sec-border: #27272a;
            --btn-sec-hover-bg: #18181b;
            --btn-sec-hover-border: #3f3f46;

            /* Gradiente original claro para o tema escuro */
            --icon-gradient: linear-gradient(135deg, #ffffff 0%, #94a3b8 100%);
            
            --shadow-card: none; /* Sem sombra no fundo preto total */
        }

        /* --- 2. RESET E ESTRUTURA --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-font-smoothing: antialiased;
        }

        body {
            font-family: var(--font-main);
            background-color: var(--bg-body);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        /* --- 3. HEADER & LOGO --- */
        .top-header {
            margin-bottom: 24px;
            text-align: center;
            animation: fadeDown 0.6s ease-out forwards;
        }

        .logo {
            font-size: 26px;
            font-weight: 800;
            letter-spacing: -0.03em;
            color: var(--text-primary);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 2px;
        }

        .logo .dot {
            color: var(--accent-color);
            font-size: 32px;
            line-height: 0;
            margin-bottom: 8px; /* Ajuste ótico */
        }

        /* --- 4. CONTAINER E CARD --- */
        .container {
            width: 100%;
            max-width: 480px;
            perspective: 1000px;
        }

        .error-card {
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            border-top-color: var(--card-border-highlight); 
            border-radius: var(--radius-xl);
            padding: 48px 40px;
            text-align: center;
            box-shadow: var(--shadow-card);
            
            /* Animação */
            opacity: 0;
            transform: translateY(30px);
            animation: fadeUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.1s forwards;
            transition: background-color 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
        }

        /* Badge */
        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            color: var(--text-secondary);
            background: var(--badge-bg);
            border: 1px solid var(--badge-border);
            padding: 8px 16px;
            border-radius: 99px;
            margin-bottom: 32px;
        }

        /* Ícone Animado */
        .icon-area {
            font-size: 72px;
            margin-bottom: 24px;
            display: inline-block;
            background: var(--icon-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            /* Filtro de sombra ajustado para não quebrar no claro */
            filter: drop-shadow(0 10px 20px rgba(0, 0, 0, 0.15));
            animation: float 6s ease-in-out infinite;
        }

        h1 {
            font-size: 26px;
            font-weight: 700;
            margin-bottom: 12px;
            letter-spacing: -0.02em;
            color: var(--text-primary);
        }

        p {
            font-size: 15px;
            color: var(--text-secondary);
            line-height: 1.6;
            margin-bottom: 40px;
        }

        /* --- 5. BOTÕES --- */
        .actions {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 16px 24px;
            border-radius: var(--radius-md);
            font-weight: 600;
            font-size: 14px;
            text-decoration: none;
            transition: all 0.2s ease;
            cursor: pointer;
        }

        /* Primário */
        .btn-primary {
            background-color: var(--btn-primary-bg);
            color: var(--btn-primary-text);
            border: 1px solid var(--btn-primary-bg);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            opacity: 0.9;
        }

        /* Secundário */
        .btn-secondary {
            background-color: var(--btn-sec-bg);
            color: var(--btn-sec-text);
            border: 1px solid var(--btn-sec-border);
        }

        .btn-secondary:hover {
            background-color: var(--btn-sec-hover-bg);
            border-color: var(--btn-sec-hover-border);
            color: var(--text-primary);
        }

        /* --- ANIMAÇÕES --- */
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes fadeDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Responsividade */
        @media (min-width: 480px) {
             .actions {
                flex-direction: row;
            }
            .btn {
                width: 100%;
            }
        }
    </style>
</head>
<body>

    <main class="container">
        
        <div class="error-card">
              
      
            <div class="status-badge">
                404 • Página não encontrada
            </div>

            <div class="icon-area">
                <i class="ph-fill ph-rocket-launch"></i>
            </div>

            <h1>Ops! Página não encontrada</h1>
            
            <p>
                A página que você tentou acessar não existe, mudou de endereço ou foi deletada.
            </p>

            <div class="actions">
          
                <a href="index.html" class="btn btn-primary">
                    <i class="ph-bold ph-house"></i>
                    Ir para o Início
                </a>
            </div>
        </div>
    </main>

    <script>
        // Script de Auto-Detecção de Tema
        (function() {
            try {
                const savedTheme = localStorage.getItem('theme');
                const systemPrefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;

                if (savedTheme === 'dark' || (!savedTheme && systemPrefersDark)) {
                    document.body.classList.add('dark-mode');
                } else {
                    document.body.classList.remove('dark-mode');
                }
                
                // Monitora mudanças no sistema em tempo real
                window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', e => {
                    if (!localStorage.getItem('theme')) {
                        if (e.matches) document.body.classList.add('dark-mode');
                        else document.body.classList.remove('dark-mode');
                    }
                });
            } catch (e) { console.error(e); }
        })();
    </script>

</body>
</html>
