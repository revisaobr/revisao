<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página não encontrada | Revisão</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <style>
        :root {
            /* --- Paleta Minimalista Dark --- */
            --bg-pure-black: #000000;
            
            /* O cartão é ligeiramente mais claro que o fundo puro para contraste */
            --card-bg: #0a0a0a; 
            --card-border: #1f1f1f;
            --card-border-highlight: rgba(255, 255, 255, 0.1);

            --text-primary: #ffffff;
            --text-secondary: #a1a1aa;
            
            --accent-color: #3b82f6; /* Azul vibrante para o ponto da logo */

            --btn-primary-bg: #ffffff;
            --btn-primary-text: #000000;
            
            --btn-sec-bg: transparent;
            --btn-sec-border: #27272a;
            --btn-sec-hover: #18181b;

            /* Ícone com gradiente sutil para profundidade */
            --icon-gradient: linear-gradient(135deg, #ffffff 0%, #94a3b8 100%);

            --radius-xl: 24px;
            --radius-md: 12px;
            
            --font-main: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        body {
            font-family: var(--font-main);
            background-color: var(--bg-pure-black); /* Preto Puro */
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        /* --- Header com Logo --- */
        .top-header {
            margin-bottom: 40px;
            text-align: center;
            animation: fadeDown 0.8s ease-out forwards;
        }

        .logo {
            font-size: 24px;
            font-weight: 800;
            letter-spacing: -0.5px;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
        }

        /* O ponto colorido na logo */
        .logo .dot {
            color: var(--accent-color);
            font-size: 28px;
            line-height: 0;
            position: relative;
            top: 2px;
        }

        /* --- Container Principal --- */
        .container {
            width: 100%;
            max-width: 500px;
            perspective: 1000px;
        }

        /* --- Card Principal --- */
        .error-card {
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            /* Luz sutil vinda de cima na borda */
            border-top-color: var(--card-border-highlight); 
            border-radius: var(--radius-xl);
            padding: 48px;
            text-align: center;
            /* Sombra para destacar do fundo preto */
            box-shadow: 0 20px 40px -20px rgba(0,0,0,0.8);
            
            /* Animação de Entrada */
            opacity: 0;
            transform: translateY(30px);
            animation: fadeUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.2s forwards;
        }

        /* Badge de Status */
        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: var(--text-secondary);
            background: #111111;
            border: 1px solid var(--card-border);
            padding: 8px 16px;
            border-radius: 99px;
            margin-bottom: 32px;
        }

        /* Área do Ícone */
        .icon-area {
            font-size: 72px;
            margin-bottom: 24px;
            display: inline-block;
            background: var(--icon-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 20px rgba(255, 255, 255, 0.1));
            animation: float 6s ease-in-out infinite;
        }

        h1 {
            font-size: 30px;
            font-weight: 700;
            margin-bottom: 16px;
            letter-spacing: -0.03em;
            color: var(--text-primary);
        }

        p {
            font-size: 16px;
            color: var(--text-secondary);
            line-height: 1.6;
            margin-bottom: 40px;
        }

        /* --- Botões --- */
        .actions {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 16px 24px;
            border-radius: var(--radius-md);
            font-weight: 600;
            font-size: 15px;
            text-decoration: none;
            transition: all 0.2s ease;
        }

        /* Botão Primário (Branco) */
        .btn-primary {
            background-color: var(--btn-primary-bg);
            color: var(--btn-primary-text);
            border: 1px solid var(--btn-primary-bg);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(255, 255, 255, 0.15);
        }

        /* Botão Secundário (Outline) */
        .btn-secondary {
            background-color: var(--btn-sec-bg);
            color: var(--text-secondary);
            border: 1px solid var(--btn-sec-border);
        }

        .btn-secondary:hover {
            background-color: var(--btn-sec-hover);
            color: var(--text-primary);
            border-color: var(--text-secondary);
        }

        /* --- Animações --- */
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes fadeDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Responsividade */
        @media (min-width: 480px) {
             .actions {
                flex-direction: row;
            }
            .btn {
                width: 100%;
            }
        }
    </style>
</head>
<body>



    <main class="container">
      
        <div class="error-card">
                <header class="top-header">
        <div class="logo">
            Revisão
        </div>
    </header>
            <div class="status-badge">
                404 • Página não encontrada
            </div>

            <div class="icon-area">
                <i class="ph-fill ph-rocket-launch"></i>
            </div>

            <h1>Ops! Página não encontrada</h1>
            
            <p>
                A página que você tentou acessar não existe ou foi deletada.
            </p>

            <div class="actions">
                <a href="javascript:history.back()" class="btn btn-secondary">
                    Voltar
                </a>
                <a href="index.html" class="btn btn-primary">
                    <i class="ph-bold ph-house"></i>
                    Ir para o Início
                </a>
            </div>
        </div>
    </main>

</body>
</html>
